    <link rel="canonical" href="https://www.auto88group.com/" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-tfnCopy.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script
      src="https://kit.fontawesome.com/a3860ea43f.js"
      crossorigin="anonymous"></script>
    <title>Auto88group | We Bring a Quality</title>
    <style>
      #btn-back-to-top {
        position: fixed;
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/a3860ea43f.js"
      crossorigin="anonymous"></script>
  </head>
  <body
    class="bg-gradient-to-br from-white bg-blend-saturation via-white to-rose-500 bg-fixed"
    style="
      background-image: url('../src/Images//Background/IMG_20240223_110132.jpg');
    ">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <button
      id="to-top-button"
      onclick="goToTop()"
      title="Go To Top"
      class="hidden fixed z-90 bottom-20 scale-150 active:scale-125 duration-200 right-6 border-0 w-10 h-10 rounded-full drop-shadow-md bg-red-700 text-white text-xl font-bold">
      <i class="fa fa-angle-up"></i>
    </button>
    <script>
      var toTopButton = document.getElementById("to-top-button");
      function goToTop() {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }
      window.onscroll = function () {
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200
          ? toTopButton.classList.remove("hidden")
          : toTopButton.classList.add("hidden");
      };
    </script>
  </body>
