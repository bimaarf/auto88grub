      content="auto88group, autoplaza88, automobil88, autoshow88, mobil bekas, mobil bekas pontianak, mobil bekas murah, dealer mobil bekas pontianak, dealer mobil bekas, cari mobil bekas, harga mobil, showroom mobil bekas pontianak, kredit mobil bekas pontianak, harga mobil bekas, cari mobil seken, harga second mobil, jual mobil bekas, showroom mokas pontianak, showroom mokas kalbar, dealer mobil pontianak, jual beli mobil bekas, jual beli mobil bekas pontianak,mobil second pontianak" />

    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo-tfnCopy.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <script
      src="https://kit.fontawesome.com/a3860ea43f.js"
      crossorigin="anonymous"></script>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Auto88group | We Bring a Quality</title>
    <style>
      /* CSS only for demo purpose*/
      #btn-back-to-top {
        position: fixed;
        display: none;
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/a3860ea43f.js"
      crossorigin="anonymous"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!-- TW Elements is free under AGPL, with commercial license required for specific uses. See more details: https://tw-elements.com/license/ and contact us for queries at tailwind@mdbootstrap.com -->

    <button
      id="to-top-button"
      onclick="goToTop()"
      title="Go To Top"
      class="hidden fixed z-90 bottom-20 scale-150 active:scale-125 duration-200 right-6 border-0 w-10 h-10 rounded-full drop-shadow-md bg-red-700 text-white text-xl font-bold">
      <i class="fa fa-angle-up"></i>
    </button>
    <script>
      var toTopButton = document.getElementById("to-top-button");
      function goToTop() {
        window.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      }
      window.onscroll = function () {
        document.body.scrollTop > 200 ||
        document.documentElement.scrollTop > 200
          ? toTopButton.classList.remove("hidden")
          : toTopButton.classList.add("hidden");
      };
    </script>
  </body>
</html>
